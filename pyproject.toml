[project]
name = "supplychain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bushrachohan", email = "bushrachohan2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
supplychain = "supplychain:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
